services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      retries: 10

  importer:
    build: .
    command: ["/app/importer"]
    environment:
      DATABASE_URL: postgres://shop:shop@db:5432/shop?sslmode=disable
      DATA_DIR: /data
      # A code is valid if it appears in at least this many files (1-3).
      # Changing it triggers a re-import (~30s). The import needs >= 4 GB RAM.
      IMPORT_MIN_FILES: ${IMPORT_MIN_FILES:-2}
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    command: ["/app/api"]
    environment:
      # Required: coupons are validated against valid_codes, filled by the
      # importer (which must finish first, see depends_on).
      DATABASE_URL: postgres://shop:shop@db:5432/shop?sslmode=disable
      API_KEY: ${API_KEY:-apitest}
    ports:
      - "8080:8080"
    depends_on:
      importer:
        condition: service_completed_successfully

volumes:
  pgdata:
